name: Deploy Vite Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare Output Directory
        run: |
          # Handle Nitro / TanStack Start output
          if [ -d ".output/public" ]; then
            mkdir -p dist
            cp -r .output/public/* dist/
          fi
          
          # Handle Vite SSR / client output subfolder
          if [ -d "dist/client" ]; then
            cp -r dist/client/* dist/
          fi

          # Prevent GitHub Pages from ignoring Vite asset files
          touch dist/.nojekyll

          # Verify index.html and create SPA 404 fallback
          if [ -f "dist/index.html" ]; then
            cp dist/index.html dist/404.html
          else
            echo "::error::index.html not found in dist directory!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
