name: Deploy Vite Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Locate and Prepare Output Directory
        run: |
          echo "=== Searching for build output ==="

          TARGET_INDEX=$(find . -mindepth 2 -name "index.html" ! -path "*/node_modules/*" ! -path "*/src/*" ! -path "*/public/*" | head -n 1)

          if [ -z "$TARGET_INDEX" ]; then
            echo "::error::Could not find compiled index.html!"
            exit 1
          fi

          BUILD_DIR=$(dirname "$TARGET_INDEX")
          echo "Found build output in: $BUILD_DIR"

          if [ "$BUILD_DIR" != "./dist" ] && [ "$BUILD_DIR" != "dist" ]; then
            mkdir -p dist
            cp -r "$BUILD_DIR"/* dist/
          fi

          touch dist/.nojekyll

          if [ -f "dist/index.html" ]; then
            cp dist/index.html dist/404.html
            echo "Successfully prepared dist directory."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
